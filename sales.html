<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="sales.css">
</head>
<body>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="card">
                    <span class="discount-badge">-30%</span>

        <div class="head">
            <img src="gaming-wireless-headset-1mii-y8-hybrid-active-noise-cancelling-headphones-gameonjo-647.webp" alt="Wireless headphones">
        </div>

        <div class="content">
            <h1>Aria Wireless Headphones</h1>

            <p>
                Active noise-cancelling, plush earcups, and 30
                hours of battery life on a single charge.
            </p>

            <div class="amount">
                <h2>69.69</h2>
                <p>99.99</p>
            </div>

            <div class="btn">
                <button>Add to cart</button>
                <button>Add to wishlist</button>
            </div>

            <div class="OOF">
                <span>⚠️ Only 3 left in stock</span>
            </div>
        </div>
    </div>

</body>
</html>
